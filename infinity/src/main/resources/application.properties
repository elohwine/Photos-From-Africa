spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/infinity_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:infinity}
spring.datasource.password=${DB_PASSWORD:infinity_pw}

# JPA/Hibernate (dev-friendly defaults; adjust for prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}

# 2Checkout / Verifone configuration
payments.2co.seller-id=${TCO_SELLER_ID:}
payments.2co.secret-word=${TCO_SECRET_WORD:}
payments.2co.sandbox=${TCO_SANDBOX:true}
payments.2co.currency=${TCO_CURRENCY:USD}
payments.2co.return-url=${TCO_RETURN_URL:http://localhost:8080/payments/success}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.devtools.livereload.enabled=true
spring.devtools.restart.exclude=static/**

# Stripe configuration via environment variables
# export STRIPE_API_KEY=sk_test_xxx
# export STRIPE_WEBHOOK_SECRET=whsec_xxx
