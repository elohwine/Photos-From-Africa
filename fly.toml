app = "photos-from-africa"
primary_region = "ams"
kill_signal = "SIGTERM"

[build]

[env]
  SERVER_ADDRESS = "0.0.0.0"
  SERVER_PORT = "8080"
  UPLOAD_BASE_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"

  [http_service.concurrency]
    type = "requests"
    soft_limit = 30
    hard_limit = 60

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "photos_data"
  destination = "/data"
  initial_size = "5GB"
