version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: infinity-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: infinity_db
      MYSQL_USER: infinity
      MYSQL_PASSWORD: infinity_pw
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpw"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
